x-dotnet-env: &dotnet-env
  DOTNET_ENVIRONMENT: Production
  ConnectionStrings__Postgres: ${ConnectionStrings__Postgres:-Host=postgres;Port=5432;Database=${POSTGRES_DB:-farm};Username=${POSTGRES_USER:-farm};Password=${POSTGRES_PASSWORD:-farm_password}}
  RabbitMq__Host: ${RabbitMq__Host:-rabbitmq}
  RabbitMq__Port: ${RabbitMq__Port:-5672}
  RabbitMq__Username: ${RabbitMq__Username:-${RABBITMQ_DEFAULT_USER:-guest}}
  RabbitMq__Password: ${RabbitMq__Password:-${RABBITMQ_DEFAULT_PASS:-guest}}

x-consumer-env: &consumer-env
  <<: *dotnet-env
  RabbitMq__PrefetchCount: ${RabbitMq__PrefetchCount:-10}
  Messaging__DlqReprocess__IntervalMinutes: ${Messaging__DlqReprocess__IntervalMinutes:-5}

x-infra-deps: &infra-deps
  postgres:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-farm}
      POSTGRES_USER: ${POSTGRES_USER:-farm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farm_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [farm-network]

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [farm-network]

  storage:
    build:
      context: .
      dockerfile: API/Storage/Dockerfile
    environment: *consumer-env
    depends_on: *infra-deps
    restart: unless-stopped
    networks: [farm-network]

  analytics:
    build:
      context: .
      dockerfile: API/Analytics/Dockerfile
    environment: *consumer-env
    depends_on: *infra-deps
    restart: unless-stopped
    networks: [farm-network]

  notifications:
    build:
      context: .
      dockerfile: API/Notifications/Dockerfile
    environment: *consumer-env
    depends_on: *infra-deps
    restart: unless-stopped
    networks: [farm-network]

  weather-collector:
    build:
      context: .
      dockerfile: API/WeatherCollector/Dockerfile
    environment:
      <<: *dotnet-env
      Collector__IntervalSeconds: ${Collector__IntervalSeconds:-60}
    depends_on:
      <<: *infra-deps
      storage:
        condition: service_started
      analytics:
        condition: service_started
      notifications:
        condition: service_started
    restart: unless-stopped
    networks: [farm-network]

  backend-api:
    build:
      context: .
      dockerfile: API/BackendApi/Dockerfile
    ports: ["8080:8080"]
    environment:
      <<: *dotnet-env
      ASPNETCORE_ENVIRONMENT: Production
    depends_on: *infra-deps
    restart: unless-stopped
    networks: [farm-network]

volumes:
  postgres-data:
  rabbitmq-data:

networks:
  farm-network:
    driver: bridge
